[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mycrew-backend"
version = "0.1.0"
description = "MyCrew v3 — Python sidecar backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "aiosqlite>=0.20.0",
    "pydantic>=2.10.0",
    "structlog>=24.4.0",
    "crewai>=0.100.0",
    "mcp>=1.0.0",
    "alembic>=1.14.0",
    "websockets>=14.0",
    "httpx>=0.28.0",
    "jsonschema>=4.23.0",
    "tenacity>=9.0.0",
    # code_contract AST validator (replaces regex substring match)
    "tree-sitter>=0.23,<0.24",
    "tree-sitter-c-sharp>=0.23,<0.24",
    # CrewAI 1.14.4 falls back to its native LLM path without litellm,
    # which doesn't correctly handle deepseek (and several other
    # non-OpenAI providers) tool calling protocol — tools leak as
    # DSML-format text in content instead of structured tool_calls.
    # See 2026-05-19 incident analysis: project_633b6172d873 stalled
    # because every Crew step's tool calls returned as raw DSML
    # markup and emit_output never fired.
    "litellm>=1.85.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0",
    "pytest-timeout>=2.3.0",
    "ruff>=0.8.0",
    "pyinstaller>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["api", "services", "domain", "ports", "infra", "bootstrap"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "TCH"]

[tool.ruff.lint.isort]
known-first-party = ["mycrew"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Hard kill any test that runs longer than 30s. Without this, an
# accidental infinite loop (or an aiosqlite call waiting on a held
# write lock) leaves a zombie pytest process holding the DB file —
# which then blocks the next backend startup with "database is locked".
# `method = thread` works on Windows where signal-based timeouts can't.
timeout = 30
timeout_method = "thread"
