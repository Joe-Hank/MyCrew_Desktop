[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mycrew-backend"
version = "0.1.0"
description = "MyCrew v3 — Python sidecar backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "aiosqlite>=0.20.0",
    "pydantic>=2.10.0",
    "structlog>=24.4.0",
    "crewai>=0.100.0",
    "mcp>=1.0.0",
    "alembic>=1.14.0",
    "websockets>=14.0",
    "httpx>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0",
    "ruff>=0.8.0",
    "pyinstaller>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["api", "services", "domain", "ports", "infra", "bootstrap"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "TCH"]

[tool.ruff.lint.isort]
known-first-party = ["mycrew"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
